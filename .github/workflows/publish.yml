name: Publish to PyPI and GitHub Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
          - '3.10'
          - '3.12'
          - '3.14'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e . pytest

      - name: Test
        run: pytest -q

  publish:
    name: Build, Publish, and Release
    needs: test
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the tag against pyproject.toml
        run: test "$GITHUB_REF_NAME" = "$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build package
        run: uv build

      - name: Extract Release Notes
        shell: python
        run: |
          import re
          from pathlib import Path

          version = "${{ github.ref_name }}"
          content = Path("CHANGELOG.md").read_text(encoding="utf-8")

          # Extract section for the current version (e.g. ## 0.3.1)
          pattern = rf"(^## \s*{re.escape(version)}\b.*?$)(.*?)(?=(^## \s*\d+\.\d+\.\d+\b)|\Z)"
          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          if match:
              section_body = match.group(2).strip()
          else:
              section_body = f"Release version {version}"

          pypi_link = f"[View on PyPI](https://pypi.org/project/keenv/{version}/)"
          full_notes = f"{pypi_link}\n\n{section_body}"
          Path("release_notes.md").write_text(full_notes, encoding="utf-8")

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            dist/keenv-${{ github.ref_name }}.tar.gz
