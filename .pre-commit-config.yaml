# The commit-msg hooks below only ever run once git has a commit-msg hook
# script, which `pre-commit install` writes only when asked for that type.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        files: .*\.(yaml|yml)$
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
        files: \.(py|sh|md|ya?ml)$
      - id: remove-tabs
        args: [--whitespaces-count, '2']
        files: \.(py|sh|md|ya?ml)$

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: CHANGELOG.md
        # markdownlint-cli v0.49 needs node >=22; the "system" env may bind to distro node 18.
        language_version: 24.19.0

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
      - id: require-ascii
        exclude: .*\.md$
      - id: shellcheck
        args: [-e, SC2086]
      # -i 4 overrides shfmt's tab indentation, which the forbid-tabs hook
      # above rejects in *.sh. Without it the two hooks fight over every edit.
      - id: shfmt
        args: [-w, -i, '4']

  # `cz check` validates the message against the provider's schema_pattern(),
  # so the hook environment needs the provider itself: pre-commit builds it in
  # isolation and .cz.yaml names wyld_cz. Without the extra dependency the hook
  # fails with "The committer has not been found in the system".
  #
  # The three versions move together. wyld-cz requires commitizen >=4.9,<5 and
  # implements schema_pattern() since 0.2.1; on 0.1.0 the hook raises
  # NotImplementedError on every commit. Dependabot bumps this rev and
  # requirements.txt in separate PRs and never touches additional_dependencies:
  # land them together and move the wyld-cz pins by hand.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      - id: commitizen
        additional_dependencies: [wyld-cz==0.3.1]
      - id: commitizen-branch
        additional_dependencies: [wyld-cz==0.3.1]
        stages: [pre-push]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  # Local policy checks. The logic lives in hooks/ rather than inline in this
  # file, so shellcheck above lints it and a failing check can be run by hand.
  - repo: local
    hooks:
      - id: check-git-author
        name: Require a repository-local git author
        entry: hooks/check-git-author.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-commit-trailers
        name: Reject attribution trailers in the commit message
        entry: hooks/check-commit-trailers.sh
        language: script
        stages: [commit-msg]
